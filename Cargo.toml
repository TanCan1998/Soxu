[workspace]
resolver = "3"
members = [
    "crates/soxu-protocol",
    "crates/soxu-core",
    "crates/soxu-magpie",
    "crates/soxu-drivers",
    "crates/soxu-git",
    "crates/soxu-daemon",
    "crates/soxu-desktop",
    "crates/soxu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/TanCan1998/Soxu"

[workspace.dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
futures-util = "0.3.34"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }

# 内部工作区 Crate
soxu-core = { path = "crates/soxu-core" }
soxu-drivers = { path = "crates/soxu-drivers" }
soxu-git = { path = "crates/soxu-git" }
soxu-magpie = { path = "crates/soxu-magpie" }
soxu-protocol = { path = "crates/soxu-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# 发布二进制剥离符号，减少调试信息泄露与包体积（审计项 CI-A）
[profile.release]
strip = "symbols"
