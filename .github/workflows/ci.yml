name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-and-privacy:
    name: Git Emoji & Privacy Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Git Emoji commit & PR title conventions
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/verify-commits-and-privacy.ps1 -Mode CiCheck

      - name: Run Gitleaks v8.30+ secret & privacy scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 -R gitleaks/gitleaks -p "gitleaks_*_linux_x64.tar.gz" -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml -v

  rust-check:
    name: Rust Format, Clippy & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

  mobile-web-check:
    name: Mobile Web/PWA Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: apps/mobile-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & production build
        run: pnpm run build
